[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "rwpytools"
description = "Official Python client for the Robot Wealth research data API. Serves history from cached bulk exports and tops it up in real time from the live API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robot Wealth", email = "support@robotwealth.com" }]
keywords = ["robotwealth", "trading", "research-data", "fx", "crypto", "equities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "httpx>=0.27,<1.0",
    "pyarrow>=15.0,<19.0",
    "pandas>=2.1,<3.0",
    "pydantic>=2.6,<3.0",
    "platformdirs>=4.2,<5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
dev = [
    "rwpytools[test]",
    "build>=1.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
]
docs = [
    "sphinx>=7.3",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=2.0",
]

[project.urls]
Homepage = "https://robotwealth.com"
Documentation = "https://api.robotwealth.com/v1/docs"
Issues = "https://github.com/Robot-Wealth/rwPyTools/issues"
Source = "https://github.com/Robot-Wealth/rwPyTools"

[tool.hatch.version]
path = "src/rwpytools/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rwpytools"]

[tool.hatch.build.targets.sdist]
include = ["src/rwpytools", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Explicit, rather than letting pytest-asyncio pick and warn about it.
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pyarrow",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF", "SIM", "PT"]
ignore = ["E501"]  # line length is enforced by formatter

[tool.ruff.lint.per-file-ignores]
# Tests read better with a `with pytest.raises(...)` wrapping a real block.
"tests/**" = ["B011", "PT012", "PT018"]

[tool.mypy]
# No python_version pin: mypy checks against the interpreter it runs on,
# while the package itself stays 3.10-compatible (enforced by the CI matrix).
strict = true
# pyarrow's inline annotations vary between releases, so an ignore that is
# needed on one version is "unused" on the next. Don't fail on that.
warn_unused_ignores = false
warn_redundant_casts = true
files = ["src/rwpytools"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "respx.*"]
ignore_missing_imports = true
